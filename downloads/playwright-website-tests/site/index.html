<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbourline Physio — Book a free assessment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Harbourline Physio</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <a href="/services.html">Services</a>
      <a href="/about.html">About</a>
      <a href="/#book">Book</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Back, knee and sports injuries — seen this week</h1>
      <p>Three clinics, same-week appointments, no referral needed.</p>
      <a class="cta" href="/#book">Book a free 15-minute assessment</a>
    </section>

    <section id="book" class="booking">
      <h2>Request your free assessment</h2>
      <form id="book-form" action="/api/book" method="post" novalidate>
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" required>

        <label for="email">Email — we confirm your slot here</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="slot">Preferred time</label>
        <select id="slot" name="slot">
          <option value="morning">Morning</option>
          <option value="afternoon">Afternoon</option>
        </select>

        <button type="submit">Request my assessment</button>
        <p id="form-msg" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
