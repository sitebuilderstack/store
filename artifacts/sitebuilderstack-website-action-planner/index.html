<style>
/* SiteBuilderStack Website Action Planner — visual system.
 *
 * Dark-first, because the storefront is. The bare :root block carries the
 * complete dark palette (the design's primary state); a light palette is
 * redefined under prefers-color-scheme: light guarded so an explicit dark
 * choice still wins, and again under [data-theme="light"] so the viewer's
 * toggle wins in both directions. Every colour below comes from a token.
 *
 * Colour and type tokens are the storefront's own (theme/dev/assets/sbs.css),
 * so the planner looks like the site it recommends. No web font is loaded:
 * the page must stay usable with every external request blocked.
 */

:root {
  --bg: #0B0D12;
  --surface: #12151D;
  --surface-2: #171B26;
  --border: #232A38;
  --border-strong: #7D8798;
  --text: #E9ECF3;
  --muted: #A7B0C0;
  --dim: #7D8798;
  --accent: #8AA6FF;
  --accent-ink: #0B0D12;
  --accent-soft: rgba(138, 166, 255, .12);
  --mono-accent: #5EEAD4;
  --ok: #6EE7A8;
  --warn: #F6C177;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);

  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --step--1: clamp(.82rem, .80rem + .10vw, .88rem);
  --step-0: clamp(1rem, .97rem + .16vw, 1.06rem);
  --step-1: clamp(1.14rem, 1.08rem + .30vw, 1.32rem);
  --step-2: clamp(1.34rem, 1.20rem + .70vw, 1.74rem);
  --step-3: clamp(1.60rem, 1.34rem + 1.25vw, 2.30rem);
  --step-4: clamp(1.95rem, 1.50rem + 2.10vw, 3.00rem);

  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem;
  --sp-5: 1.5rem; --sp-6: 2rem; --sp-7: 3rem; --sp-8: 4rem;
  --radius: 10px; --radius-lg: 16px;
  --dur: 170ms; --ease: cubic-bezier(.2,.7,.3,1);
  --gutter: 16px;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F7FB;
    --surface: #FFFFFF;
    --surface-2: #EEF1F7;
    --border: #DCE1EC;
    --border-strong: #5C6579;
    --text: #131722;
    --muted: #515A70;
    --dim: #6C7589;
    --accent: #2F4FC7;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(47, 79, 199, .10);
    --mono-accent: #0B6B5C;
    --ok: #0F7A4A;
    --warn: #8A5A00;
    --shadow: 0 1px 2px rgba(19,23,34,.06), 0 8px 24px rgba(19,23,34,.08);
  }
}
:root[data-theme="light"] {
  --bg: #F6F7FB;
  --surface: #FFFFFF;
  --surface-2: #EEF1F7;
  --border: #DCE1EC;
  --border-strong: #5C6579;
  --text: #131722;
  --muted: #515A70;
  --dim: #6C7589;
  --accent: #2F4FC7;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(47, 79, 199, .10);
  --mono-accent: #0B6B5C;
  --ok: #0F7A4A;
  --warn: #8A5A00;
  --shadow: 0 1px 2px rgba(19,23,34,.06), 0 8px 24px rgba(19,23,34,.08);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--step-0);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, ul, ol, figure, dl, dd, blockquote { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }

:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
/* Headings are focused programmatically so a screen reader lands on the new
   screen. That is not a control, so it gets no focus ring. */
h1[tabindex="-1"]:focus-visible { outline: none; }

.wrap { width: 100%; max-width: 820px; margin: 0 auto; padding-inline: var(--gutter); }
.wrap--wide { max-width: 1060px; }

/* ---- shell --------------------------------------------------------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.topbar__in {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding-block: var(--sp-3); flex-wrap: wrap;
}
.brand { display: inline-flex; align-items: center; gap: var(--sp-2); font-weight: 650; letter-spacing: -.01em; color: var(--text); text-decoration: none; }
.brand__mark {
  width: 1.7rem; height: 1.7rem; flex: 0 0 auto; display: grid; place-items: center;
  border-radius: 7px; background: var(--accent); color: var(--accent-ink);
  font-weight: 800; font-size: .95rem; letter-spacing: -.02em;
}
.brand__sub { color: var(--dim); font-size: var(--step--1); font-weight: 450; }
.topbar__acts { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
/* The wordmark already links to the storefront; the second link is a
   convenience that is not worth a second row on a phone. */
@media (max-width: 640px) { .topbar__acts { display: none; } }

main { padding-block: var(--sp-6) var(--sp-8); }
.screen[hidden] { display: none !important; }

/* ---- type ---------------------------------------------------------- */
.eyebrow {
  font-size: var(--step--1); letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim); font-weight: 600;
}
.h-hero { font-size: var(--step-4); line-height: 1.05; letter-spacing: -.03em; font-weight: 700; text-wrap: balance; }
.h-1 { font-size: var(--step-3); line-height: 1.12; letter-spacing: -.02em; font-weight: 680; text-wrap: balance; }
.h-2 { font-size: var(--step-2); line-height: 1.2; letter-spacing: -.015em; font-weight: 650; text-wrap: balance; }
.h-3 { font-size: var(--step-1); line-height: 1.3; letter-spacing: -.01em; font-weight: 640; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 60ch; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: var(--step--1); }
.prose { max-width: 66ch; }

/* ---- intro --------------------------------------------------------- */
.hero { display: grid; gap: var(--sp-5); padding-block: var(--sp-6) var(--sp-4); }
.hero__acts { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
.facts { display: grid; gap: var(--sp-2); margin-top: var(--sp-2); }
.facts li { display: grid; grid-template-columns: 1.1rem 1fr; gap: var(--sp-3); align-items: start; color: var(--muted); font-size: var(--step--1); }
.facts svg { width: 1.1rem; height: 1.1rem; margin-top: .28rem; color: var(--mono-accent); }

/* ---- buttons ------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  padding: .68rem 1.15rem; border-radius: var(--radius); border: 1px solid transparent;
  background: var(--accent); color: var(--accent-ink); font-weight: 620; cursor: pointer;
  text-decoration: none; line-height: 1.25; transition: filter var(--dur) var(--ease), transform var(--dur) var(--ease);
  min-width: 0;
}
.btn:hover { filter: brightness(1.08); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn--ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
.btn--ghost:hover { background: var(--surface-2); filter: none; }
.btn--quiet { background: transparent; color: var(--muted); border-color: transparent; padding-inline: .6rem; }
.btn--quiet:hover { color: var(--text); background: var(--surface-2); filter: none; }
.btn--sm { padding: .42rem .75rem; font-size: var(--step--1); }
.btn--block { width: 100%; }

/* ---- progress ------------------------------------------------------ */
.progress { display: grid; gap: var(--sp-2); margin-bottom: var(--sp-5); }
.progress__bar { display: flex; gap: 4px; }
.progress__seg { height: 4px; flex: 1 1 0; border-radius: 2px; background: var(--border); }
.progress__seg.is-done { background: var(--accent); }
.progress__seg.is-now { background: var(--mono-accent); }
.progress__txt { display: flex; justify-content: space-between; gap: var(--sp-3); font-size: var(--step--1); color: var(--dim); }

/* ---- question ------------------------------------------------------ */
.q { display: grid; gap: var(--sp-5); }
.q__group { display: grid; gap: var(--sp-3); border: 0; padding: 0; margin: 0; min-width: 0; }
.q__legend { padding: 0; }
.q__opts { display: grid; gap: var(--sp-2); }
.opt {
  display: grid; grid-template-columns: 1.15rem 1fr; gap: var(--sp-3); align-items: start;
  padding: .85rem 1rem; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); cursor: pointer; min-width: 0;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.opt:hover { border-color: var(--border-strong); background: var(--surface-2); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt__dot {
  width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 2px solid var(--border-strong);
  margin-top: .22rem; display: grid; place-items: center; flex: 0 0 auto;
}
.opt__dot--box { border-radius: 5px; }
.opt__dot::after { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform var(--dur) var(--ease); }
.opt__dot--box::after { border-radius: 2px; }
.opt__txt { min-width: 0; }
.opt__note { display: block; color: var(--dim); font-size: var(--step--1); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .opt__dot { border-color: var(--accent); }
.opt:has(input:checked) .opt__dot::after { transform: scale(1); }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 3px; }

.nav { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; padding-top: var(--sp-2); }
.nav__spacer { flex: 1 1 auto; }

/* ---- result -------------------------------------------------------- */
.result { display: grid; gap: var(--sp-6); }
.result__cols { display: grid; gap: var(--sp-6); align-items: start; }
@media (min-width: 900px) {
  .result__cols { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: var(--sp-7); }
  .result__rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 5.5rem); }
}
.section { display: grid; gap: var(--sp-4); min-width: 0; }
.section + .section { padding-top: var(--sp-6); border-top: 1px solid var(--border); }

.verdict { display: grid; gap: var(--sp-3); }
.chip {
  display: inline-flex; align-items: center; gap: .4rem; align-self: start;
  padding: .28rem .6rem; border-radius: 999px; font-size: var(--step--1); font-weight: 600;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
}
.chip--free { color: var(--mono-accent); border-color: color-mix(in srgb, var(--mono-accent) 40%, transparent); }
.chip--owned { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.chip--qualified { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

.note {
  border-left: 3px solid var(--warn); padding: var(--sp-3) var(--sp-4);
  background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--muted); font-size: var(--step--1);
}
.note + .note { margin-top: var(--sp-2); }

.because { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.because li {
  font-size: var(--step--1); color: var(--muted);
  border: 1px solid var(--border); border-radius: 999px; padding: .22rem .65rem;
  background: var(--surface); max-width: 100%; overflow-wrap: anywhere;
}

/* The three actions are genuinely ordered, so they are numbered. */
.actions { display: grid; gap: var(--sp-5); counter-reset: step; }
.action { display: grid; grid-template-columns: 2.1rem minmax(0, 1fr); gap: var(--sp-4); min-width: 0; }
.action__n {
  counter-increment: step; width: 2.1rem; height: 2.1rem; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border);
  color: var(--accent); font-weight: 700; font-size: var(--step--1); font-variant-numeric: tabular-nums;
}
.action__n::before { content: counter(step); }
.action__body { display: grid; gap: var(--sp-3); min-width: 0; }
.action__what { font-size: var(--step-1); font-weight: 600; line-height: 1.35; letter-spacing: -.01em; }
.meta { display: grid; gap: var(--sp-2); }
.meta div { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: var(--sp-3); align-items: baseline; }
.meta dt { font-size: var(--step--1); color: var(--dim); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; white-space: nowrap; }
.meta dd { margin: 0; color: var(--muted); font-size: var(--step--1); min-width: 0; }
.meta .verify { color: var(--text); font-family: var(--font-mono); font-size: .82rem; }
@media (max-width: 560px) {
  .meta div { grid-template-columns: minmax(0, 1fr); gap: var(--sp-1); }
}

/* ---- prompt -------------------------------------------------------- */
.promptbox { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.promptbox__head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); background: var(--surface-2);
  flex-wrap: wrap;
}
.promptbox__title { font-size: var(--step--1); font-weight: 650; letter-spacing: -.005em; }
.promptbox__body { margin: 0; padding: var(--sp-4); overflow-x: auto; }
.promptbox__body code {
  font-family: var(--font-mono); font-size: .8rem; line-height: 1.65; color: var(--text);
  white-space: pre-wrap; overflow-wrap: anywhere; display: block;
}
.copyfallback { display: grid; gap: var(--sp-2); padding: var(--sp-4); border-top: 1px solid var(--border); }
.copyfallback textarea {
  width: 100%; min-height: 8rem; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-3);
  font-family: var(--font-mono); font-size: .78rem; resize: vertical;
}

/* ---- product card -------------------------------------------------- */
.card {
  border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface);
  padding: var(--sp-5); display: grid; gap: var(--sp-4); min-width: 0; box-shadow: var(--shadow);
}
.card--flat { box-shadow: none; background: transparent; }
.card__head { display: grid; gap: var(--sp-2); }
.card__price {
  font-family: var(--font-mono); font-size: var(--step-1); color: var(--mono-accent);
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.card__list { display: grid; gap: var(--sp-2); }
.card__list li { display: grid; grid-template-columns: .9rem minmax(0, 1fr); gap: var(--sp-3); font-size: var(--step--1); color: var(--muted); align-items: start; }
.card__list li::before { content: "▸"; color: var(--accent); line-height: 1.6; }
.limit { font-size: var(--step--1); color: var(--dim); border-top: 1px dashed var(--border); padding-top: var(--sp-3); }
.disclosure { font-size: var(--step--1); color: var(--dim); }

details.more { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
details.more > summary {
  cursor: pointer; padding: var(--sp-3) var(--sp-4); font-size: var(--step--1); font-weight: 600;
  list-style: none; display: flex; align-items: center; gap: var(--sp-2);
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; color: var(--accent); font-weight: 700; width: 1ch; }
details.more[open] > summary::before { content: "−"; }
details.more > .more__body { padding: 0 var(--sp-4) var(--sp-4); display: grid; gap: var(--sp-3); }

.table { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
.table th, .table td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th { color: var(--dim); font-weight: 600; }
.table td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }

.maths { display: grid; gap: var(--sp-2); font-size: var(--step--1); }
.maths__row { display: flex; justify-content: space-between; gap: var(--sp-3); }
.maths__row span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.maths__verdict { font-weight: 600; color: var(--text); }

.toolbar { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.status { font-size: var(--step--1); color: var(--ok); min-height: 1.4em; }
.status--err { color: var(--warn); }

footer.foot { border-top: 1px solid var(--border); padding-block: var(--sp-6); color: var(--dim); font-size: var(--step--1); }
.foot__in { display: grid; gap: var(--sp-3); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

</style>

        why: 'You also named ' + goalLabel(sel.statedSecondary || sel.secondaryGoal).toLowerCase() + '. That is a different problem with a different product, and it is optional — the primary recommendation stands on its own.',
      } : null,
      bundle: bundle,
      offerBundle: offerBundle,
      ownership: { owned: owned, unknown: ownsUnknown, notes: ownershipNotes, ownedPrimary: ownedPrimary },
      freeStep: freeStepFor(C, a, sel, q),
      priceState: ps,
      selection: sel,
    };
  }

  function goalHeadline(g, a, q) {
    var H = {
      build: 'Get this build to a launch you can defend.',
      seo: 'Find out why search cannot see this site.',
      convert: 'Trust the numbers before you change the page.',
      maintain: 'Turn maintenance into checks with a rhythm.',
      shopify_admin: 'Export first, audit second, write last.',
      migrate: 'Inventory everything while the old site is still up.',
      agency: 'Make the engagement repeatable, not the argument.',
    };
    if (q.flags.convert_not_live || q.flags.seo_before_launch || q.flags.maintain_not_live) return 'First, finish the build.';
    if (q.flags.convert_no_traffic) return 'You need arrivals before you optimise them.';
    return H[g] || 'Start with a baseline.';
  }
  function goalSummary(g, a, q) {
    if (q.flags.convert_not_live) return 'getting the site live and correct, not optimising a conversion rate on a site nobody can reach yet.';
    if (q.flags.convert_no_traffic) return 'discovery — the site is live, but conversion work on almost no traffic optimises a percentage of nearly nothing.';
    if (q.flags.seo_before_launch) return 'building the search architecture into the site now, rather than auditing a site that is not published.';
    if (q.flags.maintain_not_live) return 'reaching a launch, after which the operations work has something to operate.';
    var S = {
      build: 'a build problem: structure and constraints decided before code, then a gate in front of every deploy.',
      seo: 'a discovery problem, and it is almost certainly mechanical rather than a matter of writing more.',
      convert: 'a measurement problem before it is a design problem.',
      maintain: 'operational: the failures that matter are the quiet ones, and they are found by checks that run on a schedule.',
      shopify_admin: 'catalogue automation, which is safe only with an export to roll back to and a read-back after every write.',
      migrate: 'a mapping and validation exercise — a migration is not a copy.',
      agency: 'in the engagement rather than the build: scope, review, handoff and the record of what was decided.',
    };
    return S[g] || 'not yet clearly defined.';
  }

  function fitText(g, a, q, p) {
    var bits = [];
    if (q.flags.convert_not_live) bits.push('Your goal was conversion, but the site is not live yet, so the build product comes first.');
    if (q.flags.convert_no_traffic) bits.push('Your goal was conversion, but with little or no traffic the constraint is discovery, so this is the product for that.');
    if (q.flags.seo_before_launch) bits.push('An audit toolkit needs a published site; this one builds the search architecture in from the start.');
    if (q.flags.agency_defers) bits.push('Client delivery is the way you work; this product is for the project itself.');
    bits.push(p.useCase);
    return bits.join(' ');
  }
  function limitationText(p, a, q) {
    var ex = (p.exclusions || [])[0] || '';
    var base = 'Reasons this might not be for you yet: ' + ex;
    if (a.readiness === 'access_help') base += ' It also assumes you will run the prompts yourself inside Claude Code — there is a learning curve, and nothing here does the work unattended.';
    return base;
  }
  function freeVsPaid(g, p) {
    var F = {
      build: 'The plan above gets you a brief, a memory file and a gate. The product adds the staged build prompt, the platform systems, the security and accessibility audits, and the launch checklists.',
      seo: 'The plan above is the first three checks. The product adds the remaining seventeen prompts in dependency order, the report templates, and the rules that stop an audit quietly reporting a success it never checked.',
      convert: 'The plan above verifies measurement and tests one change. The product adds the full funnel and analytics-verification workflows, the finding format with honesty labels, and an experimentation system that refuses tests the traffic cannot support.',
      maintain: 'The plan above is the first baseline. The product adds the scripts that produce it every month, the health score, the deploy gates, the incident playbooks and the reporting.',
      shopify_admin: 'The plan above is export, audit, single write. The product adds the scripts and validated GraphQL for every catalogue area, with a preview, a backup and a read-back built into each one.',
      migrate: 'The plan above is the inventory and the redirect map. The product adds the crawler, the page-by-page metadata comparison, the platform guides and the GO / NO-GO scorecard.',
      agency: 'The plan above sets up one client file set. The product adds the commands for every stage from discovery to retention, the templates, the checklists and a complete worked engagement.',
    };
    return F[g] || 'The plan above is free and yours to keep. The product is the complete workflow set for the same problem.';
  }

  /* ------------------------------------------------------------------ *
   * Export as Markdown (used by the copy and download controls)
   * ------------------------------------------------------------------ */
  function toMarkdown(result, catalogue) {
    var C = indexCatalogue(catalogue), L = [];
    L.push('# Your SiteBuilderStack website action plan');
    L.push('');
    L.push('_Generated by the SiteBuilderStack Website Action Planner. This plan is based entirely on the answers you selected — nothing about your website was scanned, crawled or measured._');
    L.push('');
    L.push('## Your answers');
    result.because.forEach(function (b) { L.push('- ' + b); });
    L.push('');
    L.push('## Your next move');
    L.push('**' + result.headline + '**');
    L.push('');
    L.push(result.summary);
    if (result.qualificationNotes.length) {
      L.push('');
      result.qualificationNotes.forEach(function (n) { L.push('> ' + n); L.push('>'); });
    }
    L.push('');
    L.push('## Three prioritised actions');
    result.actions.forEach(function (ac, i) {
      L.push('');
      L.push('### ' + (i + 1) + '. ' + ac.what);
      L.push('');
      L.push('- **Why:** ' + ac.why);
      L.push('- **Deliverable:** ' + ac.deliverable);
      L.push('- **How to verify it is done:** ' + ac.verify);
    });
    L.push('');
    L.push('## Free starter Claude Code prompt');
    L.push('');
    L.push('**' + result.prompt.title + '**');
    L.push('');
    L.push('```');
    L.push(result.prompt.text);
    L.push('```');
    if (result.primary) {
      L.push('');
      L.push('## Recommended toolkit');
      L.push('');
      L.push('**' + result.primary.product.title + '** — ' + result.primary.priceText);
      L.push('');
      L.push(result.primary.fit);
      L.push('');
      (result.primary.product.benefits || []).slice(0, 3).forEach(function (b) { L.push('- ' + b); });
      L.push('');
      L.push('- **Prerequisites:** ' + result.primary.product.prerequisites);
      L.push('- **What the free plan does vs the product:** ' + result.primary.freeVsPaid);
      L.push('- **' + result.primary.limitation + '**');
      L.push('');
      L.push(result.primary.product.url);
    }
    if (result.offerBundle && result.bundle.statement) {
      L.push('');
      L.push('## Bundle comparison');
      L.push('');
      L.push(result.bundle.statement);
      L.push('');
      L.push(C.byId['complete-stack'].url);
    }
    if (result.ownership.notes.length) {
      L.push('');
      L.push('## What you already own');
      result.ownership.notes.forEach(function (n) { L.push('- ' + n); });
    }
    if (result.freeStep) {
      L.push('');
      L.push('## A free next step');
      L.push('');
      L.push('[' + result.freeStep.resource.title + '](' + result.freeStep.resource.url + ') — ' + result.freeStep.why);
    }
    L.push('');
    L.push('---');
    L.push('');
    L.push('Produced by SiteBuilderStack — https://sitebuilderstack.com');
    L.push('');
    L.push('This plan reflects self-reported answers. It is not an audit, a measurement, or a verified assessment of your website. Prices were last verified on ' + (result.priceState.verifiedOn || 'an unknown date') + '.');
    L.push('');
    return L.join('\n');
  }

  return {
    GOALS: GOALS, PLATFORMS: PLATFORMS, STAGES: STAGES, READINESS: READINESS,
    CONTEXT: CONTEXT, GOAL_PRODUCT: GOAL_PRODUCT,
    goalLabel: goalLabel, platformLabel: platformLabel, stageLabel: stageLabel,
    readinessLabel: readinessLabel, contextLabel: contextLabel,
    normalize: normalize, relevantContextKeys: relevantContextKeys, activeGoals: activeGoals,
    qualify: qualify, selectProducts: selectProducts,
    bundleComparison: bundleComparison, indexCatalogue: indexCatalogue,
    priceState: priceState, priceText: priceText, fmt: fmt, money: money,
    decide: decide, toMarkdown: toMarkdown,
  };
});

<script>
/* src/analytics.js — the measurement interface, and the attribution links.
 *
 * WHAT THIS DOES NOT DO: it does not transmit anything. The claude.ai
 * artifact sandbox serves the page under a Content Security Policy that
 * allows fetch, XHR and WebSocket only to the page's own origin and the
 * Google Fonts hosts. No permitted destination for these events has been
 * verified, so REMOTE is false and the only provider is a local debug
 * journal that never leaves the visitor's browser. Turning it on is one
 * object with a send(name, props) method — and a verified destination.
 *
 * The journal is DEBUG INSTRUMENTATION. It counts what one browser did.
 * It is not analytics, it is not a visitor count, and the page says so.
 *
 * The only thing that actually reaches SiteBuilderStack is the campaign
 * parameters on an outbound link the visitor chooses to follow, and those
 * carry a fixed placement name — never an answer.
 */
window.SBSPlannerAnalytics = (function () {
  'use strict';

  var VERSION = '1.0.0';
  var NAME = 'sitebuilderstack-website-action-planner';

  /* The ten canonical events. Nothing else is ever recorded. */
  var EVENTS = [
    'artifact_opened',
    'planner_started',
    'planner_completed',
    'recommendation_viewed',
    'starter_prompt_copied',
    'plan_export_requested',
    'plan_export_completed',
    'product_cta_clicked',
    'free_resource_clicked',
    'planner_share_clicked',
  ];
  /* Fired at most once per page view. */
  var ONCE = ['artifact_opened', 'planner_started', 'planner_completed'];

  /* The only properties that may travel with an event. Questionnaire
     answers, ownership selections, free text, email addresses and website
     URLs are not on this list and are dropped by reduce(). */
  var ALLOWED = ['artifact_name', 'artifact_version', 'product_id', 'cta_placement', 'environment', 'timestamp'];

  /* Fixed, documented utm_content values. An outbound link may use one of
     these and nothing else — see measurement.md. */
  var PLACEMENTS = [
    'primary_recommendation',
    'recommendation_repeat',
    'complementary_recommendation',
    'bundle_comparison',
    'product_comparison',
    'free_next_step',
    'example_result',
    'header_brand',
    'footer_brand',
  ];
  /* Note: there is no 'share_planner' placement. The share control copies the
     artifact's own claude.ai URL, which is not a sitebuilderstack.com link and
     carries no campaign parameters at all. */

  var CAMPAIGN = {
    utm_source: 'claude_artifact',
    utm_medium: 'interactive_tool',
    utm_campaign: 'website_action_planner',
  };

  /* Remote transmission is off until a permitted destination and the full
     delivery path have been verified. Neither has been. */
  var REMOTE = false;
  var REMOTE_REASON = 'No permitted destination has been verified for this runtime. The artifact sandbox blocks outbound requests, so nothing is sent.';

  var environment = (typeof window !== 'undefined' && window.Shopify && window.Shopify.analytics && typeof window.Shopify.analytics.publish === 'function')
    ? 'sitebuilderstack' : 'claude_artifact';

  var journal = [];
  var MAX = 200;
  var fired = {};

  function reduce(props) {
    var out = {};
    ALLOWED.forEach(function (k) {
      var v = props[k];
      if (v === undefined || v === null || v === '') return;
      out[k] = typeof v === 'string' ? v.slice(0, 80) : (typeof v === 'number' || typeof v === 'boolean') ? v : String(v).slice(0, 80);
    });
    return out;
  }

  function track(name, props) {
    try {
      if (EVENTS.indexOf(name) === -1) return false;
      if (ONCE.indexOf(name) !== -1) { if (fired[name]) return false; fired[name] = true; }
      var payload = reduce(Object.assign({
        artifact_name: NAME,
        artifact_version: VERSION,
        environment: environment,
        timestamp: new Date().toISOString(),
      }, props || {}));
      journal.push({ event: name, props: payload });
      if (journal.length > MAX) journal = journal.slice(-MAX);
      persist();
      /* if (REMOTE) providers.forEach(function (p) { p.send(name, payload); }); */
      return true;
    } catch (e) { return false; }
  }

  function persist() {
    try { window.sessionStorage.setItem('sbs-planner-journal', JSON.stringify(journal)); } catch (e) { /* private window, blocked storage — the journal stays in memory */ }
  }
  function restore() {
    try {
      var v = window.sessionStorage.getItem('sbs-planner-journal');
      if (v) { var j = JSON.parse(v); if (Array.isArray(j)) journal = j.slice(-MAX); }
    } catch (e) { /* ignored on purpose */ }
  }
  restore();

  /* Outbound links. Existing query parameters on the target are preserved;
     the campaign parameters are set, not appended blindly. */
  function tag(url, placement) {
    try {
      var u = new URL(url, 'https://sitebuilderstack.com');
      if (u.protocol !== 'https:' || u.hostname !== 'sitebuilderstack.com') return url;
      Object.keys(CAMPAIGN).forEach(function (k) { u.searchParams.set(k, CAMPAIGN[k]); });
      u.searchParams.set('utm_content', PLACEMENTS.indexOf(placement) !== -1 ? placement : 'unknown_placement');
      return u.toString();
    } catch (e) { return url; }
  }

  return {
    VERSION: VERSION, NAME: NAME,
    EVENTS: EVENTS, ALLOWED: ALLOWED, PLACEMENTS: PLACEMENTS, CAMPAIGN: CAMPAIGN,
    remoteEnabled: REMOTE, remoteReason: REMOTE_REASON,
    environment: environment,
    track: track, tag: tag,
    journal: function () { return journal.slice(); },
    clear: function () { journal = []; fired = {}; persist(); },
  };
})();

</script>

/* src/config.js — the facts that are only known after publishing.
 *
 * SHARE_URL is the artifact's real, published URL. It is filled in after the
 * first publish and the page is republished; while it is empty the share
 * control is hidden rather than pointing at a URL that does not exist.

 * COMPANION_PAGE is the proposed sitebuilderstack.com landing page. It is

window.SBS_PLANNER_CONFIG = {

<script>
/* src/app.js — the interface. All routing decisions come from
 * recommendation-rules.js; this file only asks the questions and draws
 * the answer. Nothing here fetches, and nothing is persisted except the
 * local debug journal, which holds no answers.
 *
 * Every node is built with createElement and textContent. No markup is
 * ever assembled from data, so there is no path from an answer to HTML.
 */
(function () {
  'use strict';

  var R = window.SBS_RULES;
  var CAT = window.SBS_PRODUCTS;
  var AN = window.SBSPlannerAnalytics;
  var CFG = window.SBS_PLANNER_CONFIG || { SHARE_URL: '', COMPANION_PAGE: '' };
  var C = R.indexCatalogue(CAT);

  /* ---------------- tiny DOM helpers ---------------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;            /* only ever called with literal icon markup below */
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : String(v));
    });
    (kids || []).forEach(function (k) { if (k) n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); });
    return n;
  }
  function frag(kids) { var f = document.createDocumentFragment(); kids.forEach(function (k) { if (k) f.appendChild(k); }); return f; }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  var TICK = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.2 12 13 4.5"/></svg>';

  /* ---------------- state ---------------- */
  var state = { step: -1, answers: { owns: [] }, result: null, isExample: false };
  var downloads = null;

  var STEPS = ['goal', 'platform', 'stage', 'context', 'readiness', 'owns'];
  var STEP_TITLE = {
    goal: 'What are you trying to do?',
    platform: 'What is the site built on?',
    stage: 'Where is it right now?',
    context: 'A little more about the problem',
    readiness: 'How are you placed for Claude Code?',
    owns: 'Do you already own any of these?',
  };

  /* ---------------- shell ---------------- */
  var root = document.getElementById('app');

  function mount() {
    AN.track('artifact_opened', {});
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        window.claude.use('downloads').then(function (d) { downloads = d; if (state.step === 99) render(); })
          .catch(function () { downloads = null; });
      } catch (e) { downloads = null; }
    }
    render();
  }

  function render() {
    clear(root);
    if (state.step === -1) root.appendChild(viewIntro());
    else if (state.step === 99) root.appendChild(viewResult());
    else root.appendChild(viewStep());
    var h = root.querySelector('[data-focus]');
    if (h && state.step !== -1) { h.focus({ preventScroll: true }); window.scrollTo(0, 0); }
  }

  /* ---------------- intro ---------------- */
  function viewIntro() {
    var facts = [
      'The plan is free, and the whole result is on one page.',
      'No email address is required to see it — SiteBuilderStack does not ask for one here.',
      'Recommendations come from your answers and nothing else.',
      'This tool does not scan, crawl or audit a live website.',
    ];
    return el('div', { class: 'wrap' }, [
      el('section', { class: 'hero' }, [
        el('p', { class: 'eyebrow', text: 'SiteBuilderStack · Website Action Planner' }),
        el('h1', { class: 'h-hero', text: 'Find your next website move.' }),
        el('p', { class: 'lede', text: 'Answer a few questions to get a practical action plan, a starter Claude Code prompt, and a toolkit recommendation matched to your goal.' }),
        el('div', { class: 'hero__acts' }, [
          el('button', { class: 'btn', type: 'button', id: 'start', onclick: start }, ['Build my free plan']),
          el('button', { class: 'btn btn--ghost', type: 'button', id: 'example', onclick: showExample }, ['See an example']),
        ]),
        el('ul', { class: 'facts' }, facts.map(function (f) {
          return el('li', {}, [el('span', { html: TICK }), el('span', { text: f })]);
        })),
      ]),
      el('section', { class: 'section', style: 'margin-top:1rem' }, [
        el('p', { class: 'small dim prose', text: 'This planner is made by SiteBuilderStack and recommends SiteBuilderStack products. It is not an independent review site. The paid products are downloadable workflows, prompts, templates and checklists you run yourself inside Claude Code — not services that do the work for you.' }),
      ]),
    ]);
  }

  function start() {
    state.isExample = false;
    state.answers = { owns: [] };
    state.step = 0;
    AN.track('planner_started', {});
    render();
  }

  var EXAMPLE = {
    goal: 'seo', goal_secondary: '', platform: 'wordpress', stage: 'live_no_traffic',
    seo_symptom: 'not_indexed', readiness: 'using', owns: ['none'],
  };
  function showExample() {
    state.isExample = true;
    state.answers = JSON.parse(JSON.stringify(EXAMPLE));
    state.result = R.decide(state.answers, CAT);
    state.step = 99;
    render();
  }

  /* ---------------- questions ---------------- */
  function activeContextKeys() { return R.relevantContextKeys(state.answers); }

  function viewStep() {
    var id = STEPS[state.step];
    var body;
    if (id === 'goal') body = qGoal();
    else if (id === 'platform') body = qSingle('platform', 'Which of these is closest?', R.PLATFORMS);
    else if (id === 'stage') body = qSingle('stage', 'Where is the project today?', R.STAGES);
    else if (id === 'context') body = qContext();
    else if (id === 'readiness') body = qSingle('readiness', 'Pick the one that fits.', R.READINESS);
    else body = qOwns();

    return el('div', { class: 'wrap' }, [
      progress(),
      el('div', { class: 'q' }, [
        el('h1', { class: 'h-1', tabindex: '-1', 'data-focus': '1', text: STEP_TITLE[id] }),
        body,
        navRow(),
      ]),
    ]);
  }

  function progress() {
    var segs = STEPS.map(function (_, i) {
      return el('div', { class: 'progress__seg' + (i < state.step ? ' is-done' : i === state.step ? ' is-now' : '') });
    });
    return el('div', { class: 'progress' }, [
      el('div', { class: 'progress__bar', role: 'presentation' }, segs),
      el('div', { class: 'progress__txt' }, [
        el('span', { text: 'Step ' + (state.step + 1) + ' of ' + STEPS.length, 'aria-live': 'polite' }),
        el('span', { text: 'No email required' }),
      ]),
    ]);
  }

  function optionRow(type, name, value, text, note, checked, onchange) {
    var input = el('input', { type: type, name: name, value: value, checked: checked || null, onchange: onchange });
    return el('label', { class: 'opt' }, [
      input,
      el('span', { class: 'opt__dot' + (type === 'checkbox' ? ' opt__dot--box' : ''), 'aria-hidden': 'true' }),
      el('span', { class: 'opt__txt' }, [el('span', { text: text }), note ? el('span', { class: 'opt__note', text: note }) : null]),
    ]);
  }

  function group(legend, rows, hint) {
    return el('fieldset', { class: 'q__group' }, [
      el('legend', { class: 'q__legend h-3' }, [legend]),
      hint ? el('p', { class: 'small dim', text: hint }) : null,
      el('div', { class: 'q__opts' }, rows),
    ]);
  }

  function qSingle(key, legend, pairs, hint) {
    var rows = pairs.map(function (p) {
      return optionRow('radio', key, p[0], p[1], null, state.answers[key] === p[0], function () {
        state.answers[key] = p[0];
        updateNav();
      });
    });
    return group(legend, rows, hint);
  }

  function qGoal() {
    var primary = R.GOALS.map(function (g) {
      return optionRow('radio', 'goal', g[0], g[1], null, state.answers.goal === g[0], function () {
        state.answers.goal = g[0];
        if (state.answers.goal_secondary === g[0]) state.answers.goal_secondary = '';
        /* a changed goal invalidates the contextual answers it owned */
        Object.keys(R.CONTEXT).forEach(function (k) {
          if (activeContextKeys().indexOf(k) === -1) delete state.answers[k];
        });
        render();
      });
    });
    var secondaryOpts = [optionRow('radio', 'goal_secondary', '', 'Nothing else for now', null, !state.answers.goal_secondary, function () {
      state.answers.goal_secondary = '';
      Object.keys(R.CONTEXT).forEach(function (k) { if (activeContextKeys().indexOf(k) === -1) delete state.answers[k]; });
    })].concat(R.GOALS.filter(function (g) { return g[0] !== state.answers.goal; }).map(function (g) {
      return optionRow('radio', 'goal_secondary', g[0], g[1], null, state.answers.goal_secondary === g[0], function () {
        state.answers.goal_secondary = g[0];
        Object.keys(R.CONTEXT).forEach(function (k) { if (activeContextKeys().indexOf(k) === -1) delete state.answers[k]; });
      });
    }));

    return frag([
      group('Your main goal', primary),
      state.answers.goal ? el('details', { class: 'more' }, [
        el('summary', { text: 'Add a second goal (optional)' }),
        el('div', { class: 'more__body' }, [
          el('p', { class: 'small dim', text: 'Only if a second problem is genuinely in front of you. It changes the plan, and it is used to compare the bundle price honestly — never to add products you did not ask for.' }),
          el('div', { class: 'q__opts' }, secondaryOpts),
        ]),
      ]) : null,
    ]);
  }

  function qContext() {
    var keys = activeContextKeys();
    if (!keys.length) {
      return el('p', { class: 'muted', text: 'Nothing else is needed for this goal — go on to the next step.' });
    }
    return frag(keys.map(function (k) {
      var q = R.CONTEXT[k];
      if (q.multi) {
        var current = Array.isArray(state.answers[k]) ? state.answers[k] : [];
        var rows = q.options.map(function (o) {
          return optionRow('checkbox', k + '[]', o[0], o[1], null, current.indexOf(o[0]) !== -1, function (ev) {
            var arr = Array.isArray(state.answers[k]) ? state.answers[k].slice() : [];
            var excl = q.exclusive || [];
            if (ev.target.checked) {
              if (excl.indexOf(o[0]) !== -1) arr = [o[0]];
              else arr = arr.filter(function (x) { return excl.indexOf(x) === -1; }).concat([o[0]]);
            } else {
              arr = arr.filter(function (x) { return x !== o[0]; });
            }
            state.answers[k] = arr;
            render();
          });
        });
        return group(q.question, rows, 'Select any that apply.');
      }
      var rows2 = q.options.map(function (o) {
        return optionRow('radio', k, o[0], o[1], null, state.answers[k] === o[0], function () {
          state.answers[k] = o[0];
          updateNav();
        });
      });
      return group(q.question, rows2);
    }));
  }

  function qOwns() {
    var owns = Array.isArray(state.answers.owns) ? state.answers.owns : [];
    var rows = [optionRow('checkbox', 'owns[]', 'none', 'I own none of them', null, owns.indexOf('none') !== -1, onOwn('none'))];
    C.raw.products.forEach(function (p) {
      rows.push(optionRow('checkbox', 'owns[]', p.id, p.title, p.isBundle ? 'Counts as owning its three products' : null, owns.indexOf(p.id) !== -1, onOwn(p.id)));
    });
    rows.push(optionRow('checkbox', 'owns[]', 'notsure', 'Not sure', null, owns.indexOf('notsure') !== -1, onOwn('notsure')));
    return group('This is optional, and nothing is looked up.', rows, 'No login, no purchase history, nothing sent anywhere. It is here so the planner does not recommend something you have already bought.');
  }
  function onOwn(id) {
    return function (ev) {
      var owns = Array.isArray(state.answers.owns) ? state.answers.owns.slice() : [];
      if (ev.target.checked) {
        if (id === 'none' || id === 'notsure') owns = [id];
        else owns = owns.filter(function (x) { return x !== 'none' && x !== 'notsure'; }).concat([id]);
      } else {
        owns = owns.filter(function (x) { return x !== id; });
      }
      state.answers.owns = owns;
      render();
    };
  }

  /* ---------------- navigation ---------------- */
  function canAdvance() {
    var id = STEPS[state.step];
    if (id === 'goal') return !!state.answers.goal;
    if (id === 'platform') return !!state.answers.platform;
    if (id === 'stage') return !!state.answers.stage;
    if (id === 'readiness') return !!state.answers.readiness;
    if (id === 'context') {
      return activeContextKeys().every(function (k) {
        var q = R.CONTEXT[k];
        return q.multi ? (Array.isArray(state.answers[k]) && state.answers[k].length > 0) : !!state.answers[k];
      });
    }
    return Array.isArray(state.answers.owns) && state.answers.owns.length > 0;
  }
  function updateNav() {
    var n = document.getElementById('next');
    if (n) n.disabled = !canAdvance();
  }
  function navRow() {
    var last = state.step === STEPS.length - 1;
    return el('div', { class: 'nav' }, [
      state.step > 0 ? el('button', { class: 'btn btn--ghost', type: 'button', onclick: back }, ['Back']) : null,
      el('button', { class: 'btn', type: 'button', id: 'next', disabled: !canAdvance() || null, onclick: next }, [last ? 'Show my plan' : 'Next']),
      el('span', { class: 'nav__spacer' }),
      el('button', { class: 'btn btn--quiet btn--sm', type: 'button', onclick: reset }, ['Start again']),
    ]);
  }
  function back() { if (state.step > 0) { state.step--; render(); } }
  function next() {
    if (!canAdvance()) return;
    if (state.step === STEPS.length - 1) {
      state.result = R.decide(state.answers, CAT);
      state.step = 99;
      AN.track('planner_completed', {});
      AN.track('recommendation_viewed', { product_id: state.result.primary ? state.result.primary.id : 'none' });
      render();
      return;
    }
    state.step++;
    render();
  }
  function reset() {
    state.step = -1; state.answers = { owns: [] }; state.result = null; state.isExample = false;
    render();
  }

  /* ---------------- result ---------------- */
  function viewResult() {
    var r = state.result;
    var chip = r.mode === 'free_first' ? ['chip chip--free', 'Free path first']
      : r.mode === 'use_what_you_own' ? ['chip chip--owned', 'You already own it']
      : r.mode === 'qualified' ? ['chip chip--qualified', 'Qualified result']
      : ['chip', 'Matched to your answers'];

    var left = el('div', { class: 'result__main' }, [
      sectionNextMove(r, chip),
      sectionActions(r),
      sectionPrompt(r),
      sectionFreeStep(r),
      sectionControls(r),
    ]);
    var rail = el('aside', { class: 'result__rail' }, [sectionToolkit(r)]);

    return el('div', { class: 'wrap wrap--wide result' }, [
      state.isExample ? exampleBanner() : null,
      el('div', { class: 'result__cols' }, [left, rail]),
      footerNote(r),
    ]);
  }

  function exampleBanner() {
    return el('div', { class: 'note', style: 'border-left-color: var(--accent)' }, [
      el('strong', { text: 'Example project. ' }),
      el('span', { text: 'A WordPress site that is live, gets almost no traffic, and has pages missing from the index. It is an illustration of the output — not a real customer, not a case study, and not a measurement of any website.' }),
      el('div', { style: 'margin-top:.6rem' }, [
        el('button', { class: 'btn btn--sm', type: 'button', onclick: start }, ['Build my own plan']),
      ]),
    ]);
  }

  function sectionNextMove(r, chip) {
    return el('section', { class: 'section' }, [
      el('span', { class: chip[0], text: chip[1] }),
      el('h1', { class: 'h-1', tabindex: '-1', 'data-focus': '1', text: r.headline }),
      el('p', { class: 'lede', text: r.summary }),
      r.qualificationNotes.length ? el('div', {}, r.qualificationNotes.map(function (n) { return el('p', { class: 'note', text: n }); })) : null,
      el('div', {}, [
        el('p', { class: 'eyebrow', text: 'Recommended because you selected', style: 'margin-bottom:.5rem' }),
        el('ul', { class: 'because' }, r.because.map(function (b) { return el('li', { text: b }); })),
      ]),
      r.ownership.notes.length ? el('div', {}, r.ownership.notes.map(function (n) { return el('p', { class: 'note', style: 'border-left-color: var(--ok)', text: n }); })) : null,
    ]);
  }

  function sectionActions(r) {
    return el('section', { class: 'section' }, [
      el('h2', { class: 'h-2', text: 'Three prioritised actions' }),
      el('p', { class: 'small dim', text: 'In this order. Each one names what you will have when it is finished, and how to tell.' }),
      el('ol', { class: 'actions' }, r.actions.map(function (a) {
        return el('li', { class: 'action' }, [
          el('span', { class: 'action__n', 'aria-hidden': 'true' }),
          el('div', { class: 'action__body' }, [
            el('p', { class: 'action__what', text: a.what }),
            el('dl', { class: 'meta' }, [
              el('div', {}, [el('dt', { text: 'Why' }), el('dd', { text: a.why })]),
              el('div', {}, [el('dt', { text: 'You get' }), el('dd', { text: a.deliverable })]),
              el('div', {}, [el('dt', { text: 'Verify' }), el('dd', { class: 'verify', text: a.verify })]),
            ]),
          ]),
        ]);
      })),
    ]);
  }

  function sectionPrompt(r) {
    var box = el('div', { class: 'promptbox' }, [
      el('div', { class: 'promptbox__head' }, [
        el('span', { class: 'promptbox__title', text: r.prompt.title }),
        el('button', { class: 'btn btn--sm btn--ghost', type: 'button', id: 'copy-prompt', onclick: function () { doCopy(r.prompt.text, 'prompt-status', 'starter_prompt_copied'); } }, ['Copy prompt']),
      ]),
      el('pre', { class: 'promptbox__body' }, [el('code', { text: r.prompt.text })]),
    ]);
    return el('section', { class: 'section' }, [
      el('h2', { class: 'h-2', text: 'Your free starter Claude Code prompt' }),
      el('p', { class: 'small dim prose', text: 'Paste this into Claude Code in your project folder. It reads and reports; it changes nothing. It is yours to keep and edit whether or not you buy anything.' }),
      box,
      el('p', { class: 'status', id: 'prompt-status', role: 'status', 'aria-live': 'polite' }),
      el('div', { id: 'prompt-fallback' }),
    ]);
  }

  function sectionToolkit(r) {
    var kids = [];
    if (r.primary) {
      var p = r.primary.product;
      kids.push(el('div', { class: 'card' }, [
        el('div', { class: 'card__head' }, [
          el('p', { class: 'eyebrow', text: r.primary.deEmphasised ? 'When you are ready' : 'Your recommended toolkit' }),
          el('h2', { class: 'h-3', text: p.title }),
          el('p', { class: 'card__price', text: r.primary.priceText }),
        ]),
        el('p', { class: 'small muted', text: r.primary.fit }),
        el('ul', { class: 'card__list' }, p.benefits.slice(0, 3).map(function (b) { return el('li', {}, [el('span', { text: b })]); })),
        el('p', { class: 'small muted' }, [el('strong', { text: 'Free plan vs the product. ' }), el('span', { text: r.primary.freeVsPaid })]),
        el('p', { class: 'small muted' }, [el('strong', { text: 'You need first. ' }), el('span', { text: p.prerequisites })]),
        ctaLink(p, r.primary.cta, 'primary_recommendation', r.primary.deEmphasised),
        el('p', { class: 'limit', text: r.primary.limitation }),
      ]));
    } else if (r.mode === 'use_what_you_own') {
      kids.push(el('div', { class: 'card' }, [
        el('p', { class: 'eyebrow', text: 'Nothing to buy' }),
        el('h2', { class: 'h-3', text: 'You already have the right product' }),
        el('p', { class: 'small muted', text: 'The plan on this page is how to use it. If you want a refresher on the workflow it belongs to, the free resource below covers the same ground.' }),
      ]));
    } else {
      kids.push(el('div', { class: 'card' }, [
        el('p', { class: 'eyebrow', text: 'No product recommended' }),
        el('h2', { class: 'h-3', text: 'Your answers do not justify a purchase yet' }),
        el('p', { class: 'small muted', text: 'Buying something now would be a guess. Work the three actions, then come back — the routing is deterministic, so a sharper answer produces a specific recommendation.' }),
      ]));
    }

    if (r.complementary) {
      var c = r.complementary.product;
      kids.push(el('div', { class: 'card card--flat' }, [
        el('p', { class: 'eyebrow', text: 'Optional, and only if the second problem is real' }),
        el('h3', { class: 'h-3', text: c.title }),
        el('p', { class: 'card__price', text: r.complementary.priceText }),
        el('p', { class: 'small muted', text: r.complementary.why }),
        ctaLink(c, 'View the ' + c.shortName, 'complementary_recommendation', true),
      ]));
    }

    if (r.offerBundle) {
      kids.push(bundleCard(r));
    }

    kids.push(comparisonPanel(r));
    kids.push(el('p', { class: 'disclosure', text: 'SiteBuilderStack makes this planner and sells these products. Prices were last verified on ' + (r.priceState.verifiedOn || 'an unknown date') + '; the product page is always the authority.' }));
    return el('section', { class: 'section', style: 'gap:1.25rem' }, kids);
  }

  function bundleCard(r) {
    var b = C.byId['complete-stack'];
    return el('div', { class: 'card' }, [
      el('p', { class: 'eyebrow', text: 'Cheaper for what you named' }),
      el('h3', { class: 'h-3', text: b.title }),
      el('p', { class: 'card__price', text: R.priceText(C, b, r.priceState) }),
      el('p', { class: 'small muted', text: r.bundle.statement }),
      ctaLink(b, 'View the ' + b.shortName, 'bundle_comparison', false),
    ]);
  }

  /* The comparison is available on demand, never eight buttons by default.
     Ticking products recalculates the bundle arithmetic honestly. */
  function comparisonPanel(r) {
    var chosen = (r.bundle.selected || []).slice();
    var out = el('div', { class: 'more__body' });
    var details = el('details', { class: 'more' }, [
      el('summary', { text: 'Compare the bundle, and see every product' }),
      out,
    ]);

    function redraw() {
      clear(out);
      var cmp = R.bundleComparison(C, chosen, r.ownership.owned, r.priceState);
      out.appendChild(el('p', { class: 'small dim', text: 'Tick what you genuinely expect to use in the next few months. The comparison is arithmetic, not a recommendation.' }));
      var rows = C.bundleMembers.map(function (id) {
        var p = C.byId[id];
        var ownedAlready = r.ownership.owned.indexOf(id) !== -1;
        return optionRow('checkbox', 'cmp[]', id, p.shortName + ' — ' + R.priceText(C, p, r.priceState), ownedAlready ? 'You said you own this' : null, chosen.indexOf(id) !== -1, function (ev) {
          chosen = ev.target.checked ? chosen.concat([id]) : chosen.filter(function (x) { return x !== id; });
          redraw();
        });
      });
      out.appendChild(el('div', { class: 'q__opts' }, rows));
      var maths = el('div', { class: 'maths' }, []);
      if (cmp.individualTotal !== null) {
        maths.appendChild(el('div', { class: 'maths__row' }, [el('span', { text: 'Those you do not own, individually' }), el('span', { text: R.fmt(cmp.individualTotal, 'USD') })]));
        maths.appendChild(el('div', { class: 'maths__row' }, [el('span', { text: 'Complete Site Builder Stack' }), el('span', { text: R.fmt(cmp.bundlePrice, 'USD') })]));
      }
      maths.appendChild(el('p', { class: 'maths__verdict small', text: cmp.statement || 'Tick at least one product to compare.' }));
      out.appendChild(maths);
      out.appendChild(el('p', { class: 'small dim', text: C.bundleNote }));

      out.appendChild(el('h4', { class: 'eyebrow', style: 'margin-top:.75rem', text: 'Every product, for reference' }));
      var wrap = el('div', { class: 'tablewrap' });
      var table = el('table', { class: 'table' }, [
        el('thead', {}, [el('tr', {}, [el('th', { text: 'Product' }), el('th', { text: 'For' }), el('th', { text: 'Price' })])]),
        el('tbody', {}, C.raw.products.map(function (p) {
          return el('tr', {}, [
            el('td', {}, [el('a', { href: AN.tag(p.url, 'product_comparison'), target: '_blank', rel: 'noopener', text: p.shortName, onclick: function () { AN.track('product_cta_clicked', { product_id: p.id, cta_placement: 'product_comparison' }); } })]),
            el('td', { text: p.useCase }),
            el('td', { class: 'num', text: R.priceText(C, p, r.priceState) }),
          ]);
        })),
      ]);
      wrap.appendChild(table);
      out.appendChild(wrap);
    }
    redraw();
    return details;
  }

  function ctaLink(product, text, placement, quiet) {
    /* A click from the worked example is not a click from someone's own plan,
       so it gets its own placement and stays separable in the campaign report. */
    if (state.isExample) placement = 'example_result';
    return el('a', {
      class: 'btn' + (quiet ? ' btn--ghost' : '') + ' btn--block',
      href: AN.tag(product.url, placement),
      target: '_blank', rel: 'noopener',
      'data-cta': placement,
      onclick: function () { AN.track('product_cta_clicked', { product_id: product.id, cta_placement: placement }); },
    }, [text]);
  }

  function sectionFreeStep(r) {
    if (!r.freeStep) return null;
    var f = r.freeStep.resource;
    return el('section', { class: 'section' }, [
      el('h2', { class: 'h-2', text: 'A free next step' }),
      el('p', { class: 'prose muted', text: r.freeStep.why }),
      el('p', {}, [
        el('a', {
          class: 'btn btn--ghost', href: AN.tag(f.url, 'free_next_step'), target: '_blank', rel: 'noopener',
          'data-free': f.id,
          onclick: function () { AN.track('free_resource_clicked', { cta_placement: 'free_next_step' }); },
        }, [f.title + ' →']),
      ]),
    ]);
  }

  function sectionControls(r) {
    var acts = [
      el('button', { class: 'btn btn--ghost btn--sm', type: 'button', id: 'copy-plan', onclick: function () { doCopy(R.toMarkdown(r, CAT), 'plan-status', null); } }, ['Copy action plan']),
      el('button', { class: 'btn btn--ghost btn--sm', type: 'button', id: 'export-plan', hidden: !downloads, onclick: function () { doExport(r); } }, ['Export as Markdown']),
      CFG.SHARE_URL ? el('button', { class: 'btn btn--ghost btn--sm', type: 'button', id: 'share', onclick: sharePlanner }, ['Share the planner']) : null,
      el('button', { class: 'btn btn--quiet btn--sm', type: 'button', id: 'again', onclick: reset }, ['Start again']),
    ];
    var kids = [
      el('h2', { class: 'h-2', text: 'Take it with you' }),
      el('div', { class: 'toolbar' }, acts),
      el('p', { class: 'status', id: 'plan-status', role: 'status', 'aria-live': 'polite' }),
      el('div', { id: 'plan-fallback' }),
    ];
    if (!downloads) {
      kids.push(el('p', { class: 'small dim', text: 'File export is not available in this view, so it is not offered. Copy the action plan instead — it is the same Markdown.' }));
    }
    if (r.primary) {
      kids.push(el('div', { style: 'margin-top:1.25rem' }, [
        el('p', { class: 'small muted', text: 'If the plan above is the work you are about to do, the ' + r.primary.product.shortName + ' is the complete version of it.' }),
        el('p', { style: 'margin-top:.6rem' }, [
          el('a', {
            class: 'btn btn--ghost', href: AN.tag(r.primary.product.url, 'recommendation_repeat'), target: '_blank', rel: 'noopener',
            onclick: function () { AN.track('product_cta_clicked', { product_id: r.primary.id, cta_placement: 'recommendation_repeat' }); },
          }, [r.primary.cta]),
        ]),
      ]));
    }
    kids.push(measurementPanel());
    return el('section', { class: 'section' }, kids);
  }

  function measurementPanel() {
    return el('details', { class: 'more' }, [
      el('summary', { text: 'What this page measures' }),
      el('div', { class: 'more__body' }, [
        el('p', { class: 'small muted', text: 'Nothing is transmitted. ' + AN.remoteReason }),
        el('p', { class: 'small muted', text: 'Your answers, what you own and anything you copy stay in this browser tab and are not written anywhere. Reloading the page loses them, which is deliberate.' }),
        el('p', { class: 'small muted', text: 'A local debug journal records event names only — ' + AN.EVENTS.length + ' possible names, with at most a product id and a link placement. It counts what this one browser did. It is not analytics and it is not a visitor count.' }),
        el('p', { class: 'small dim', text: 'Links to sitebuilderstack.com carry campaign parameters (' + AN.CAMPAIGN.utm_campaign + ') and a fixed placement name, so the store can see that a visit came from this planner. No answer is ever put in a link.' }),
        el('button', { class: 'btn btn--quiet btn--sm', type: 'button', onclick: function (e) {
          var box = e.target.nextElementSibling;
          box.hidden = !box.hidden;
          if (!box.hidden) box.textContent = JSON.stringify(AN.journal(), null, 1);
        } }, ['Show the local journal']),
        el('pre', { class: 'promptbox__body small', hidden: true, style: 'border:1px solid var(--border);border-radius:10px' }),
      ]),
    ]);
  }

  function footerNote(r) {
    return el('footer', { class: 'foot' }, [
      el('div', { class: 'foot__in' }, [
        el('p', { class: 'small dim', text: 'This plan is based on the answers you selected. Nothing about your website was scanned, crawled or measured, and none of it is a verified assessment.' }),
        el('p', {}, [
          el('a', {
            href: AN.tag('https://sitebuilderstack.com/', 'footer_brand'), target: '_blank', rel: 'noopener', text: 'sitebuilderstack.com',
          }),
          el('span', { class: 'dim', text: '  ·  Independent product. Not affiliated with, sponsored by, or endorsed by Anthropic. “Claude” and “Claude Code” are trademarks of Anthropic, PBC.' }),
        ]),
      ]),
    ]);
  }

  /* ---------------- copy / export / share ---------------- */
  function setStatus(id, text, isErr) {
    var n = document.getElementById(id);
    if (!n) return;
    n.textContent = text;
    n.className = 'status' + (isErr ? ' status--err' : '');
  }
  function fallbackBox(id, text) {
    var host = document.getElementById(id);
    if (!host) return;
    clear(host);
    var ta = el('textarea', { readonly: true, 'aria-label': 'Text to copy' });
    ta.value = text;
    host.appendChild(el('div', { class: 'copyfallback' }, [
      el('p', { class: 'small dim', text: 'Clipboard access was refused here. The text is selected below — press Ctrl+C (or ⌘C) to copy it.' }),
      ta,
    ]));
    try { ta.focus(); ta.select(); } catch (e) { /* nothing more we can do */ }
  }
  function doCopy(text, statusId, eventName) {
    var fbId = statusId === 'prompt-status' ? 'prompt-fallback' : 'plan-fallback';
    var host = document.getElementById(fbId);
    if (host) clear(host);
    setStatus(statusId, '');
    var done = function () {
      setStatus(statusId, 'Copied.');
      if (eventName) AN.track(eventName, {});
    };
    var failed = function () {
      setStatus(statusId, 'Could not copy automatically.', true);
      fallbackBox(fbId, text);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, failed);
      } else { failed(); }
    } catch (e) { failed(); }
  }
  function doExport(r) {
    if (!downloads) { setStatus('plan-status', 'File export is not available in this view.', true); return; }
    AN.track('plan_export_requested', {});
    setStatus('plan-status', 'Waiting for you to confirm the download…');
    downloads.save({ filename: 'sitebuilderstack-action-plan.md', data: R.toMarkdown(r, CAT) }).then(function (res) {
      if (res && res.status === 'saved') {
        setStatus('plan-status', 'Saved.');
        AN.track('plan_export_completed', {});
      } else {
        setStatus('plan-status', 'Sent to your device.');
      }
    }, function (err) {
      var code = err && err.code;
      setStatus('plan-status', code === 'declined' ? 'Download cancelled.' : 'The download could not be completed. Use “Copy action plan” instead.', true);
    });
  }
  function sharePlanner() {
    if (!CFG.SHARE_URL) return;
    AN.track('planner_share_clicked', {});
    doCopy(CFG.SHARE_URL, 'plan-status', null);
    setTimeout(function () {
      var n = document.getElementById('plan-status');
      if (n && n.textContent === 'Copied.') n.textContent = 'Planner link copied. It opens the planner itself — your answers are not in it.';
    }, 0);
  }

  /* expose for the browser test harness only */
  window.__planner = { state: state, render: render, decide: function () { return R.decide(state.answers, CAT); } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();

</script>
